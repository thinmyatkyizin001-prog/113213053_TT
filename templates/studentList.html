<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastAPI Template</title>
  </head>
<body>
	<h1>List Students from table</h1>
	<table>
	<tr>
		<td>流水號</td>
		<td>學號</td>
		<td>姓名</td>
	</tr>
	{% for p in students %}
	<tr>
		<td>{{ loop.index }}:<a href="/student/edit/{{p.stuid }}" style="text-decoration:none">Edit &nbsp;&nbsp;&nbsp;&nbsp;</a></td>
		<td>{{ p.stuid }} </td>
		<td>{{ p.name }}&nbsp;&nbsp;&nbsp;&nbsp;</td>
		<td><a href="/student/create/" style="text-decoration:none">Create &nbsp;&nbsp;&nbsp;&nbsp;</a></td>
		<!--<td><a href="/student/create/{{p.stuid}}">Create &nbsp;&nbsp;&nbsp;&nbsp;</a></td>-->
		<td><a href="/student/delete/{{p.stuid }}" style="text-decoration:none"  onclick="return confirm('Are you sure?');">Delete &nbsp;&nbsp;&nbsp;&nbsp;</a></td>
	</tr>
	{% endfor %}
	</table>
	
</body>
</html>
